name: Build Fork

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target platform'
        required: true
        default: 'android'
        type: choice
        options:
          - android
          - windows
          - linux
          - macos

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.platform || 'push' }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.50.0'
  GO_VERSION: '1.27.1'
  NDK_VERSION: r28c
  PACKAGE_TAG: v0.9.4

jobs:
  build-android:
    if: github.event_name == 'push' || inputs.platform == 'android'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Apply Mihomo Fallback Enhancement
        shell: bash
        run: git -C core/Clash.Meta apply --include=adapter/outboundgroup/fallback.go "$GITHUB_WORKSPACE/.github/mihomo-patch/enhance-fallback.patch"

      - name: Setup Android Signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          KEY_ALIAS_VAL: ${{ secrets.SIGNING_KEY_ALIAS }}
          STORE_PASS_VAL: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_PASS_VAL: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          : "${KEYSTORE_B64:?Configure SIGNING_KEYSTORE_BASE64}"
          : "${KEY_ALIAS_VAL:?Configure SIGNING_KEY_ALIAS}"
          : "${STORE_PASS_VAL:?Configure SIGNING_STORE_PASSWORD}"
          : "${KEY_PASS_VAL:?Configure SIGNING_KEY_PASSWORD}"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > android/app/keystore.jks
          {
            printf 'keyAlias=%s\n' "$KEY_ALIAS_VAL"
            printf 'storePassword=%s\n' "$STORE_PASS_VAL"
            printf 'keyPassword=%s\n' "$KEY_PASS_VAL"
          } >> android/local.properties

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: core/go.sum

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: build-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
          link-to-sdk: true

      - name: Get Flutter Dependency
        run: |
          flutter --version
          flutter pub get

      - name: Fetch CA certificates
        shell: bash
        env:
          CA_BUNDLE: cacert-2026-09-25.pem
        run: |
          bundle=core/Clash.Meta/component/ca/ca-certificates.crt
          curl -fsSL --retry 3 -o "$bundle" "https://curl.se/ca/$CA_BUNDLE"

      - name: Build Android APK
        env:
          ANDROID_NDK_HOME: ${{ steps.build-ndk.outputs.ndk-path }}
        run: dart tool/package.dart android --tag "$PACKAGE_TAG" -v

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FlClash-android-fallback
          path: ./dist
          overwrite: true

  build-desktop:
    if: github.event_name == 'push' || inputs.platform != 'android'
    runs-on: ${{ (github.event_name == 'push' || inputs.platform == 'windows') && 'windows-2022' || (inputs.platform == 'macos' && 'macos-latest' || 'ubuntu-22.04') }}
    env:
      TARGET_PLATFORM: ${{ inputs.platform || 'windows' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Apply Mihomo Fallback Enhancement
        shell: bash
        run: git -C core/Clash.Meta apply --include=adapter/outboundgroup/fallback.go "$GITHUB_WORKSPACE/.github/mihomo-patch/enhance-fallback.patch"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: core/go.sum

      - name: Enable git long paths (Windows)
        if: env.TARGET_PLATFORM == 'windows'
        run: git config --global core.longpaths true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Get Flutter Dependency
        run: |
          flutter --version
          flutter pub get

      - name: Fetch CA certificates
        shell: bash
        env:
          CA_BUNDLE: cacert-2026-09-25.pem
        run: |
          bundle=core/Clash.Meta/component/ca/ca-certificates.crt
          curl -fsSL --retry 3 -o "$bundle" "https://curl.se/ca/$CA_BUNDLE"

      - name: Build Desktop
        shell: bash
        env:
          FLUTTER_MACOS_ARM64_ONLY: ${{ env.TARGET_PLATFORM == 'macos' }}
        run: dart tool/package.dart "$TARGET_PLATFORM" --tag "$PACKAGE_TAG" -v

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FlClash-${{ env.TARGET_PLATFORM }}-fallback
          path: ./dist
          overwrite: true
